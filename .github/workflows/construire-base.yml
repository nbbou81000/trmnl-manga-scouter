name: Construire la base

on:
  schedule:
    - cron: '13 3 * * 1'   # chaque lundi vers 5 h (heure de Paris)
  workflow_dispatch:
    inputs:
      nb_mangas:
        description: 'Nombre de mangas les plus populaires à inclure'
        default: '100'
      max_par_manga:
        description: 'Nombre maximum de personnages par manga'
        default: '40'

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collecter les personnages
        env:
          NB_MANGAS: ${{ github.event.inputs.nb_mangas || '100' }}
          MAX_PAR_MANGA: ${{ github.event.inputs.max_par_manga || '40' }}
        run: node scripts/build-db.js
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/base.json
          git diff --cached --quiet || git commit -m "Base de personnages mise à jour"
          git pull --rebase
          git push
