name: Personnage au hasard

on:
  schedule:
    - cron: '7 * * * *'   # toutes les heures
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tirage
  cancel-in-progress: false

jobs:
  tirage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tirer un personnage
        run: node scripts/pick.js
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/personnage.json data/historique.json
          git diff --cached --quiet || git commit -m "Nouveau personnage"
          git pull --rebase
          git push
